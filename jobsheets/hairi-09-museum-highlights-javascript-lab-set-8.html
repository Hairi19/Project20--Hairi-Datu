<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="hairi-09-museum-highlights.css">
    <script src="hairi-09-museum-highlights-data.js"></script>
    <script src="hairi-09-museum-highlights-function.js"></script>
</head>
<body>

<main>
    <h1>SHOPPING CART</h1>

    <table>
        <thead>
            <tr>
                <th colspan="2">Product</th>
                <th>#</th>
                <th>Price</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>
            <script src="hairi-09-museum-highlights-lab7.js"></script>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4" class="right">Subtotal</td>
                <td class="right"><script>outputCurrency(subtotal)</script></td>
            </tr>
            <tr>
                <td colspan="4" class="right">Tax</td>
                <td class="right"><script>outputCurrency(tax)</script></td>
            </tr>
            <tr>
                <td colspan="4" class="right">Shipping</td>
                <td class="right"><script>outputCurrency(shipping)</script></td>
            </tr>
            <tr>
                <td colspan="4" class="right"><strong>Grand Total</strong></td>
                <td class="right"><strong><script>outputCurrency(grand)</script></strong></td>
            </tr>
        </tfoot>
    </table>
</main>

</body>
</html>
