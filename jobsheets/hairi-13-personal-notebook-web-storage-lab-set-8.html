<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Notebook</title>
<link rel="stylesheet" href="hairi-13-notebook-web-storage-lab-set-8.css">
</head>
<body>
<div class="card">
  <h1>Personal Notebook</h1>
  <button id="themeBtn">Toggle Dark Mode</button>
  <input type="text" id="noteTitle" placeholder="Note title">
  <textarea id="noteText" rows="3" placeholder="Write your note..."></textarea>
  <button id="saveBtn">Save Note</button>
  <p id="message"></p>
  <p id="count"></p>
  <div id="noteList"></div>
  <button id="clearBtn">Delete All Notes</button>
</div>
<script src="hairi-13-notebook-web-storage-lab-set-8.js"></script>
</body>
</html>
