<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jQuery Quick Quiz</title>
<link rel="stylesheet" href="hairi-11-quiz-app-jquery-lab-set-8.css">
<script src="jquery-3.7.1.min.js"></script>
<script src="hairi-11-quiz-app-jquery-lab-set-8.js"></script>
</head>
<body>
<div class="card">
  <h1>jQuery Quick Quiz</h1>
  <div class="bar"><div id="progress"></div></div>
  <div id="quizBox">
    <p id="qnum"></p>
    <h3 id="question"></h3>
    <ul id="options"></ul>
    <p id="feedback"></p>
    <button id="nextBtn" disabled>Next</button>
  </div>
  <div id="result">
    <h2>Quiz Complete!</h2>
    <p>Your score: <b id="finalScore"></b></p>
    <button id="restartBtn">Try Again</button>
  </div>
</div>
</body>
</html>
